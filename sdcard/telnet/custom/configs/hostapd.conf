# Custom AP definition (best-effort), used only when wifi.conf has MODE=ap with
# a non-empty SSID. prepare-telnet-sd fills SSID/passphrase in the copy written
# to the card under output/. Whether the stock firmware honours this depends on
# when it reads /etc/config/hostapd.conf relative to our boot hook; if it is too
# late, the factory AP SSID stays. The builder fills in the ssid= and
# wpa_passphrase= values below.
interface=wlan0
driver=nl80211
hw_mode=g
channel=6
auth_algs=1
ignore_broadcast_ssid=0
ssid=BOOTSTRAP_SSID
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=BOOTSTRAP_PASSPHRASE
