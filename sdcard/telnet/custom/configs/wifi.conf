# Wi-Fi configuration for the Telnet bootstrap card (read by wifi.sh).
# Strict shell KEY=value, sourced by /bin/sh. No secrets belong in the repo:
# prepare-telnet-sd generates the real file (with your SSID/password) onto the
# card under output/ only. This template keeps the camera in its factory AP.
#
# MODE:
#   ap  - leave the camera as its own access point (factory SSID unless a custom
#         one is provided). Connect a device to it, then telnet <cam-ip> 24.
#   sta - join an existing Wi-Fi network so the camera appears on your LAN.
MODE=ap

# For MODE=sta (and optional custom MODE=ap): the network to join / advertise.
SSID=
PASS=

# SECURITY: wpa2 (WPA2-PSK) or open.
SECURITY=wpa2

# Address for MODE=sta. Leave IP empty for DHCP (find the camera in your
# router's client list). Set IP/NETMASK/GW for a fixed address.
IP=
NETMASK=255.255.255.0
GW=

# Seconds to let the firmware finish its own Wi-Fi bringup before we switch.
SETTLE=8
