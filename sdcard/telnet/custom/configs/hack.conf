# Telnet bootstrap config for the LSC Smart Connect PTZ 3007325.
# Strict shell KEY=value (sourced by /bin/sh). No secrets live here: the root
# password, if any, is a separate `shadow` file generated onto the SD root by
# build-sdcard.sh (TELNET_ROOT_PASSWORD=...), never committed to the repo.

# Enable the bootstrap Telnet service.
TELNET=1

# Port for the bootstrap Telnet. Kept off 23 so it does not clash with any
# telnetd the factory test mode may start. Connect with:  telnet <ip> 24
TELNET_PORT=24

# Silence the loud factory-mode boot voice/beep prompts (played during the PTZ
# self-test). sounds.sh bind-mounts a silent clip over them for this boot only.
#   MUTE_FACTORY_PROMPT=1  mute just the factory prompts (default)
#   MUTE_ALL_SOUNDS=1      mute every /usr/share/*.mp3 (overrides the above)
MUTE_FACTORY_PROMPT=1
MUTE_ALL_SOUNDS=0

# Optional root FTP (BusyBox ftpd via tcpsvd), for pushing files to the camera
# without rewriting the SD. Off by default; prepare-*.ps1 can switch it on.
#   FTP=1       enable the FTP service
#   FTP_PORT=21 port to listen on
FTP=0
FTP_PORT=21
