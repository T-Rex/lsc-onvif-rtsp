#onvif_simple_server configuration - LSC Smart Connect PTZ 3007325
#(Anyka AK3918EV330, firmware V3.286.81.13_BUNDLE, anyka_ipc in Factory Mode)
#
#Option names are checked against conf.c of onvif_simple_server commit
#7b3941af76a57277ba975efaf2366cb8c6fa1936.
#
#Rules of the upstream parser:
# - one key=value per line, no spaces around "=", no comments after a value
# - comment lines start with "#" in the first column
# - THE ORDER OF THE LINES MATTERS: width/height/url/... belong to the
#   preceding name= line. Do not mix the blocks.
#
#start.sh copies this file to /tmp/onvif/etc/onvif_simple_server.conf and
#  - replaces serial_num=AUTO with a stable ID derived from the wlan0 MAC
#    address (hashed, the MAC itself is not published)
#  - adds user/password from onvif_auth.conf if a user is set there
#    (user= and password= lines in this file are ignored)

#Device information (GetDeviceInformation)
model=LSC Smart PTZ 3007325
manufacturer=LSC
firmware_ver=3.286.81.13
hardware_id=AK3918EV330
serial_num=AUTO

#Network: the camera IP is read from this interface at every request, so a
#new DHCP address is picked up automatically.
ifs=wlan0
port=8080

#Scopes returned by GetScopes. start.sh passes the same list to
#wsd_simple_server, so WS-Discovery and GetScopes agree.
#Profile S only: no Profile T scope (Media2 is not enabled), no PTZ scope.
scope=onvif://www.onvif.org/Profile/Streaming
scope=onvif://www.onvif.org/type/video_encoder
scope=onvif://www.onvif.org/type/audio_encoder
scope=onvif://www.onvif.org/hardware/3007325
scope=onvif://www.onvif.org/name/LSC_Smart_PTZ_3007325

#Advanced options
adv_enable_media2=0
adv_enable_imaging=0
adv_fault_if_unknown=0
adv_fault_if_set=0
adv_synology_nvr=0

#Profile 0 - the only stream of the camera (anyka_ipc RTSP "main_ch").
#%s is replaced by the camera IP address of interface ifs.
#No snapurl line: the camera has no snapshot service.
#bitrate=0 and framerate=0 mean "unknown": the encoder settings of
#anyka_ipc have not been measured. See deployment-guide.md.
name=Profile_0
width=1920
height=1080
url=rtsp://%s:554/main_ch
type=H264
bitrate=0
framerate=0
audio_encoder=AAC
audio_decoder=NONE

#PTZ is not offered by this ONVIF server.
ptz=0

#No relay outputs, no events.
