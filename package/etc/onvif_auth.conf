#Optional ONVIF authentication (WS-Security UsernameToken, PasswordDigest).
#
#Leave user empty to disable authentication (default for initial testing on
#a trusted LAN). To enable it, set both values, then restart:
#  sh /mnt/onvif/stop.sh; sh /mnt/onvif/start.sh
#
#Notes:
# - These credentials are for ONVIF only. They do not protect the RTSP stream
#   of anyka_ipc, and they are unrelated to the Telnet/FTP root login.
# - GetSystemDateAndTime, GetCapabilities, GetServices,
#   GetServiceCapabilities and GetUsers answer without authentication, as
#   ONVIF clients need them before they log in.
# - The password is stored in plain text on the FAT32 card (readable by
#   anyone with the card) and in /tmp/onvif/etc (mode 600).
# - No spaces around "=", no quotes needed.
user=
password=
