# BusyBox httpd configuration for the ONVIF endpoint (TCP 8080).
# start.sh copies this file to /tmp/onvif/etc/httpd.conf.
#
# IP access control (A: allow, D: deny). With "D:*" present, only the
# addresses allowed by an A: line may connect; everybody else gets 403.
# Default: loopback and the private (RFC 1918) address ranges, i.e. the
# local network. This keeps working if DHCP hands out a new address.
#
# To restrict ONVIF to your camera subnet only, replace the three private
# ranges with e.g.:
#   A:192.168.100.0/24
A:127.0.0.1
A:10.0.0.0/8
A:172.16.0.0/12
A:192.168.0.0/16
D:*
